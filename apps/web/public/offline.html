<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Ranking Elite Beach</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4e9d8;
        color: #1e293b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { color: #0e7490; font-size: 1.5rem; margin-bottom: 8px; }
      p { color: #475569; line-height: 1.5; }
      button {
        margin-top: 16px;
        background: #0e7490;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ranking Elite Beach</h1>
      <p>Você está offline. Reconecte-se à internet para acessar os dados do clube.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
