# Orquestração de PRODUÇÃO (api + web). O banco é o Neon (gerenciado, externo) —
# não há Postgres aqui. Configure as variáveis num arquivo .env ao lado deste
# arquivo (veja .env.example e docs/DEPLOY.md). Suba com:
#   docker compose -f docker-compose.prod.yml up -d --build
# Rode as migrations antes de expor a nova versão:
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: reb-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3333:3333"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||3333)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: reb-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Aplica as migrations no Neon e sai. Não sobe com `up` (profile dedicado).
  # Uso: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: reb-api:latest
    profiles: ["tools"]
    env_file: .env
    command: ["pnpm", "--filter", "@reb/db", "exec", "prisma", "migrate", "deploy"]
